</head>
<body>

  <header class="site-header">

      <a href="/" class="nav-brand">

      <ul class="nav-links">

      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle light/dark theme" title="Toggle theme">
        <span class="theme-icon-light">&#9728;&#65039;</span>
        <span class="theme-icon-dark">&#9790;</span>
      </button>
    </nav>
  </header>

  <main class="main-content">
    

<div class="section-header" style="margin-top: 1.5rem; margin-bottom: 1.25rem;">

</div>


<div class="empty-state">

      &mdash; group stage starts June 11, 2026
    
  </p>
</div>



  </main>

  <footer class="site-footer">
    <span>World Cup 2026 forecast feed</span>
    
  </footer>

  <script>
    (function() {
      var saved = localStorage.getItem('wc-theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();
    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('wc-theme', next);
    }
  </script>
</body>
</html>
